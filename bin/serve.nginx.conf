# The relay `make serve` puts between the Cloudflare Tunnel and the apps it
# serves, so the hostnames Cloudflare Access guards need no login of the app's
# own. bin/serve.sh fills in the @NAME@ values and runs it from a private
# directory it removes afterwards, the prefix every relative path here resolves
# against. sites/ holds one server per app whose hostname is set.

daemon off;
worker_processes 1;
pid nginx.pid;
error_log stderr error;

events {
    worker_connections 256;
}

http {
    access_log off;
    client_body_temp_path body_temp;
    proxy_temp_path proxy_temp;
    fastcgi_temp_path fastcgi_temp;
    uwsgi_temp_path uwsgi_temp;
    scgi_temp_path scgi_temp;

    # Both apps check Origin against Host, so Host goes through as the browser
    # sent it. Each carries a WebSocket, and their event streams arrive
    # unbuffered. A location that sets a header of its own must repeat these:
    # nginx inherits none of them once it sets one.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_buffering off;

    server {
        listen 127.0.0.1:@RELAY_PORT@ default_server;
        return 404;
    }

    include sites/*.conf;
}
