# The relay `make serve` puts between the Cloudflare Tunnel and dsh web, so the
# hostname Cloudflare Access guards needs no dsh token. bin/serve.sh fills in
# the @NAME@ values and runs it from a private directory it removes afterwards,
# the prefix every relative path here resolves against.

daemon off;
worker_processes 1;
pid nginx.pid;
error_log stderr error;

events {
    worker_connections 256;
}

http {
    access_log off;
    client_body_temp_path body_temp;
    proxy_temp_path proxy_temp;
    fastcgi_temp_path fastcgi_temp;
    uwsgi_temp_path uwsgi_temp;
    scgi_temp_path scgi_temp;

    # dsh accepts a request only when Origin names the same host as Host, so
    # Host goes through as the browser sent it. /api carries a WebSocket, and
    # the event streams arrive unbuffered.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_buffering off;

    # Anything not for the tunnel's hostname reaches dsh untouched, and dsh
    # asks it for the token as usual.
    server {
        listen 127.0.0.1:@RELAY_PORT@ default_server;

        location / {
            proxy_pass http://127.0.0.1:@DSH_PORT@;
        }
    }

    server {
        listen 127.0.0.1:@RELAY_PORT@;
        server_name @SERVE_HOST@;

        location /api/ {
            proxy_pass http://127.0.0.1:@DSH_PORT@;
        }

        # A page dsh turns away for want of its cookie is redirected to the
        # startup-token URL, which dsh trades for the cookie. A request that
        # already carried a token keeps dsh's answer, so a bad one cannot loop.
        location / {
            proxy_pass http://127.0.0.1:@DSH_PORT@;
            proxy_intercept_errors on;
            error_page 401 = @token;
        }

        location @token {
            if ($arg_token) {
                return 401;
            }
            # Relative, so the browser stays on https and the public hostname.
            absolute_redirect off;
            return 302 /?token=@SERVE_TOKEN@;
        }
    }
}
