# dsh web for SERVE_HOST. dsh mints a new startup token each run and answers a
# browser without its cookie with 401, so a page it turns away is redirected to
# the token URL, which dsh trades for the cookie. A request that already carried
# a token keeps dsh's answer, so a bad one cannot loop.

server {
    listen 127.0.0.1:@RELAY_PORT@;
    server_name @SERVE_HOST@;

    location /api/ {
        proxy_pass http://127.0.0.1:@DSH_PORT@;
    }

    location / {
        proxy_pass http://127.0.0.1:@DSH_PORT@;
        proxy_intercept_errors on;
        error_page 401 = @token;
    }

    location @token {
        if ($arg_token) {
            return 401;
        }
        # Relative, so the browser stays on https and the public hostname.
        absolute_redirect off;
        return 302 /?token=@SERVE_TOKEN@;
    }
}
