# OpenCode for SERVE_OPENCODE_HOST. OpenCode asks every API request for its
# server password, and nginx sends it, so OpenCode takes whatever reaches it
# here as signed in. It checks Origin only for its own cookie, so a request a
# page on another site makes is refused here instead.

map $http_origin $opencode_origin_allowed {
    default 0;
    ''      1;
    'https://@SERVE_OPENCODE_HOST@' 1;
}

server {
    listen 127.0.0.1:@RELAY_PORT@;
    server_name @SERVE_OPENCODE_HOST@;

    location / {
        if ($opencode_origin_allowed = 0) {
            return 403;
        }
        proxy_pass http://127.0.0.1:@OPENCODE_PORT@;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Authorization 'Basic @OPENCODE_AUTH@';
    }
}
